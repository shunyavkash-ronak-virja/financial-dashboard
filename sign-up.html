<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adaptive Financial - Sign Up</title>

    <!----- Nice select css ----->
    <link rel="stylesheet" href="assets/css/nice-select.css">

    <!----- Google Font ----->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!----- Custom Style ----->
    <link rel="stylesheet" href="assets/css/mian.css" />
</head>

<body>
    <section class="authentication-section">
        <div class="authentication-container container">
            <div class="authentication-block">
                <h1 class="authentication-title">Create Your Account</h1>
                <form class="form-wrapper sign-up-form">
                    <div class="input-stack">
                        <label class="input-label" for="sign-up-name">Full Name</label>
                        <input class="input-field" type="text" id="sign-up-name" placeholder="Enter Your Full Name">
                    </div>
                    <div class="input-stack">
                        <label class="input-label" for="sign-up-email">Email Address</label>
                        <input class="input-field" type="email" id="sign-up-email" placeholder="Enter Your Email Address" required>
                    </div>
                    <div class="input-stack">
                        <label class="input-label" for="sign-up-Password">Password</label>
                        <div class="password-input-wrapper">
                            <input class="input-field" type="password" id="sign-up-Password" placeholder="Create A Password" required>
                            <div class="password-show-toggle disabled" data-password-toggle="">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="password-show-icon eye-open-icon lucide lucide-eye-icon lucide-eye">
                                    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-visibility password-show-icon eye-close-icon lucide lucide-eye-off-icon lucide-eye-off">
                                    <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path>
                                    <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
                                    <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path>
                                    <path d="m2 2 20 20"></path>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="input-stack">
                        <label class="input-label" for="sign-up-confirm-password">Confirm Password</label>
                        <div class="password-input-wrapper">
                            <input class="input-field" type="password" id="sign-up-confirm-password" placeholder="Confirm Your Password" required>
                            <div class="password-show-toggle disabled" data-password-toggle="">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="password-show-icon eye-open-icon lucide lucide-eye-icon lucide-eye">
                                    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-visibility password-show-icon eye-close-icon lucide lucide-eye-off-icon lucide-eye-off">
                                    <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path>
                                    <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
                                    <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path>
                                    <path d="m2 2 20 20"></path>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <button class="authentication-btn sign-up-btn" type="submit">Create Account</button>
                    <div class="authentication-redirection-wrapper">Already have an account?
                        <a class="authentication-redirection-link" href="sign-in.html">Sign in</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Nice select js -->
    <script src="assets/js/jquery.js"></script>
    <script src="assets/js/jquery.nice-select.js"></script>

    <!----- Custom Script ----->
    <script src="assets/js/script.js"></script>
</body>

</html>
